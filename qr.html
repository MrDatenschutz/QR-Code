<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>Nexora – QR-Code Generator</title>

<style>

:root{

 --background:#0f172a;
 --surface:#111e35;
 --surface-light:#17263f;

 --accent:#38bdf8;
 --accent-hover:#7dd3fc;

 --text:#e5e7eb;
 --muted:#94a3b8;

 --border:rgba(148,163,184,.15);

}

*{
 box-sizing:border-box;
}

body{

 font-family:'Segoe UI',sans-serif;

 background:#0f172a;

 background-image:
 radial-gradient(
 ellipse at 50% 0%,
 rgba(14,165,233,.09),
 transparent 55%
 );

 color:var(--text);

 text-align:center;

 padding:40px 20px;

 min-height:100vh;

}

h1{

 font-size:3rem;

 color:var(--accent);

 margin-bottom:30px;

}

.box{

 background:var(--surface);

 border:1px solid var(--border);

 border-radius:16px;

 max-width:600px;

 margin:0 auto;

 padding:30px;

 text-align:left;

}

label{

 display:block;

 margin-bottom:8px;

 color:var(--muted);

 font-weight:600;

}

input[type="text"]{

 width:100%;

 padding:12px 14px;

 font-size:1rem;

 border-radius:10px;

 border:1px solid var(--border);

 outline:none;

 background:var(--surface-light);

 color:var(--text);

 box-sizing:border-box;

 transition:.2s ease;

}

input[type="text"]:focus{

 border-color:
 rgba(56,189,248,.4);

 box-shadow:
 0 0 10px
 rgba(56,189,248,.15);

}

button{

 margin-top:15px;

 padding:12px 20px;

 background:#0ea5e9;

 color:#082f49;

 font-weight:700;

 border-radius:10px;

 border:none;

 cursor:pointer;

 transition:.2s ease;

}

button:hover{

 background:var(--accent-hover);

 box-shadow:
 0 0 12px
 rgba(56,189,248,.25);

}

.qr-preview{

 margin-top:25px;

 text-align:center;

}

.qr-preview img{

 background:#fff;

 padding:12px;

 border-radius:12px;

 box-shadow:
 0 0 15px
 rgba(255,255,255,.1);

}

.bottom-actions{

 display:flex;

 justify-content:center;

 margin-top:30px;

}

.back-btn{

 display:inline-block;

 background:#0ea5e9;

 color:#082f49;

 text-decoration:none;

 padding:12px 20px;

 border-radius:10px;

 font-weight:700;

 transition:.2s ease;

}

.back-btn:hover{

 background:var(--accent-hover);

 transform:translateY(-1px);

}

footer{

 margin-top:60px;

 text-align:center;

 color:#64748b;

}

</style>

</head>

<body>

<h1>Nexora – QR-Code Generator</h1>

<div class="box">

 <label for="qrInput">

 Text oder URL für den QR-Code:

 </label>

 <input
 type="text"
 id="qrInput"
 placeholder="z.B. https://mrdatenschutz.github.io/Nexora/">

 <button id="generateBtn">

 QR-Code erstellen

 </button>

 <div
 class="qr-preview"
 id="qrPreview">

 </div>

 <button
 id="downloadBtn"
 style="display:none;">

 QR-Code herunterladen

 </button>

</div>

<div class="bottom-actions">

 <a
 href="https://mrdatenschutz.github.io/Nexora/index.html"
 class="back-btn">

 Zur Startseite

 </a>

</div>

<footer>

© Nexora – QR-Code Generator

</footer>

<script>

 const input = document.getElementById('qrInput');
 const btn = document.getElementById('generateBtn');
 const preview = document.getElementById('qrPreview');
 const downloadBtn = document.getElementById('downloadBtn');

 let lastQRUrl = null;

 btn.addEventListener('click', () => {

 const value = input.value.trim();

 if (!value) {

 preview.innerHTML =
 "<p>Bitte zuerst einen Text oder eine URL eingeben.</p>";

 downloadBtn.style.display = "none";

 return;

 }

 const encoded = encodeURIComponent(value);

 const url =
 `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encoded}`;

 lastQRUrl = url;

 preview.innerHTML = `
 <p>Dein QR-Code:</p>
 <img id="qrImage" src="${url}" alt="QR-Code">
 `;

 downloadBtn.style.display = "inline-block";

 });

 downloadBtn.addEventListener('click', async () => {

 if (!lastQRUrl) return;

 const response = await fetch(lastQRUrl);

 const blob = await response.blob();

 const link = document.createElement('a');

 link.href = URL.createObjectURL(blob);

 link.download = "qr-code.png";

 link.click();

 URL.revokeObjectURL(link.href);

 });

</script>

</body>
</html>
