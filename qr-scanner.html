<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>Nexora – QR-Code Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>

:root{

 --accent:#38bdf8;
 --accent-hover:#7dd3fc;

 --text:#e5e7eb;
 --muted:#94a3b8;

 --surface:#111e35;
 --surface-light:#17263f;

 --border:rgba(148,163,184,.15);

}

*{
 box-sizing:border-box;
}

body{

 margin:0;

 min-height:100vh;

 font-family:'Segoe UI',sans-serif;

 background:#0f172a;

 background-image:
 radial-gradient(
 ellipse at 50% 0%,
 rgba(14,165,233,.09),
 transparent 55%
 );

 color:var(--text);

}

.main{

 max-width:900px;

 margin:auto;

 padding:50px 20px;

}

h1{

 text-align:center;

 color:var(--accent);

 font-size:3rem;

 margin-bottom:10px;

}

.subtitle{

 text-align:center;

 color:var(--muted);

 margin-bottom:30px;

}

.card{

 background:var(--surface);

 border:1px solid var(--border);

 border-radius:16px;

 padding:30px;

}

.upload-box{

 border:2px dashed rgba(148,163,184,.25);

 background:var(--surface-light);

 padding:30px;

 border-radius:14px;

 text-align:center;

 color:var(--muted);

 margin-bottom:20px;

}

input[type=file]{

 width:100%;

 background:var(--surface-light);

 color:var(--text);

 border:1px solid var(--border);

 border-radius:10px;

 padding:12px;

}

.preview{

 text-align:center;

 margin-top:20px;

}

.preview img{

 max-width:300px;

 border-radius:12px;

 border:1px solid var(--border);

}

.result{

 margin-top:25px;

 background:var(--surface-light);

 padding:20px;

 border-radius:12px;

 overflow-wrap:anywhere;

 word-break:break-word;

}

.result-title{

 color:var(--accent);

 font-weight:bold;

 margin-bottom:10px;

}

.open-link{

 display:none;

 margin-top:15px;

 background:#0ea5e9;

 color:#082f49;

 border:none;

 border-radius:10px;

 padding:12px 20px;

 text-decoration:none;

 font-weight:700;

}

.open-link:hover{

 background:var(--accent-hover);

}

.bottom-actions{

 display:flex;

 justify-content:center;

 margin-top:25px;

}

.back-btn{

 display:inline-block;

 background:#0ea5e9;

 color:#082f49;

 text-decoration:none;

 padding:12px 20px;

 border-radius:10px;

 font-weight:700;

}

.back-btn:hover{

 background:var(--accent-hover);

}

footer{

 margin-top:60px;

 text-align:center;

 color:#64748b;

}

</style>

</head>

<body>

<div class="main">

<h1>Nexora – QR-Code Scanner</h1>

<p class="subtitle">

PNG- oder JPG-Bild auswählen und QR-Code auslesen.

</p>

<div class="card">

<div class="upload-box">

Bild auswählen:

</div>

<input
type="file"
id="fileInput"
accept=".png,.jpg,.jpeg,image/png,image/jpeg">

<div
class="preview"
id="preview">
</div>

<div
class="result"
id="result">

<div class="result-title">

Erkanntes Ergebnis

</div>

Noch kein QR-Code analysiert.

</div>

<a
id="openLink"
class="open-link"
target="_blank">

Link öffnen

</a>

</div>

<div class="bottom-actions">

<a
href="index.html"
class="back-btn">

Zur Startseite

</a>

</div>

<footer>

© Nexora – QR-Code Scanner

</footer>

</div>

<script>

const fileInput =
document.getElementById(
"fileInput"
);

const preview =
document.getElementById(
"preview"
);

const result =
document.getElementById(
"result"
);

const openLink =
document.getElementById(
"openLink"
);

fileInput.addEventListener(

"change",

event=>{

const file =
event.target.files[0];

if(!file){

return;

}

const img =
new Image();

const reader =
new FileReader();

reader.onload = e => {

img.src =
e.target.result;

preview.innerHTML =
`<img src="${img.src}">`;

};

reader.readAsDataURL(
file
);

img.onload = ()=>{

const canvas =
document.createElement(
"canvas"
);

const ctx =
canvas.getContext(
"2d"
);

canvas.width =
img.width;

canvas.height =
img.height;

ctx.drawImage(
img,
0,
0
);

const imageData =

ctx.getImageData(

0,

0,

canvas.width,

canvas.height

);

const code =

jsQR(

imageData.data,

canvas.width,

canvas.height

);

if(code){

result.innerHTML =

`
<div class="result-title">

Erkanntes Ergebnis

</div>

${code.data}

`;

if(

code.data.startsWith(
"http://"
)

||

code.data.startsWith(
"https://"
)

){

openLink.href =
code.data;

openLink.style.display =
"inline-block";

}else{

openLink.style.display =
"none";

}

}else{

result.innerHTML =

`
<div class="result-title">

Ergebnis

</div>

Kein QR-Code gefunden.

`;

openLink.style.display =
"none";

}

};

});

</script>

</body>

</html>
